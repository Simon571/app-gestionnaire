# Mise a jour continue du cahier « Vie chretienne et ministere ».
#
# POURQUOI CE WORKFLOW
# --------------------
# L'extraction telecharge les publications .jwpub et les analyse avec
# `meeting-schedules-parser` : c'est du travail Node lourd, impossible dans une
# fonction serverless. Elle vit donc ici, et depose son resultat dans
# l'application via `POST /api/vcm/program` (script `vcm:publish`).
# L'application n'a plus besoin d'etre redeployee pour servir un programme frais.
#
# Cadence hebdomadaire : le programme se prepare au moins une semaine a l'avance,
# et le magasin se declare « perime » des qu'il reste moins de deux semaines
# couvertes. Un passage par semaine garde donc toujours de la marge.
name: Mise à jour du cahier VCM

on:
  workflow_dispatch:

  schedule:
    # Tous les lundis à 4h17 UTC. Minute décalée volontairement : les minutes
    # rondes sont saturées côté GitHub et les exécutions y sont retardées.
    - cron: '17 4 * * 1'

jobs:
  update-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Mise en place de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances NPM
        run: npm ci

      - name: Installation des navigateurs Playwright
        run: npx playwright install --with-deps

      # Extraction + normalisation + vérification des dates + validation, pour
      # les deux langues. Si l'une échoue, rien n'est publié : mieux vaut un
      # programme un peu ancien qu'un programme faux.
      - name: Extraction du programme (fr + en)
        run: npm run vcm:update:all

      - name: Dépôt dans l'application déployée
        env:
          VCM_PUBLISH_URL: ${{ secrets.PROD_APP_URL }}
          API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
        run: |
          npm run vcm:publish
          npm run vcm:publish:en

      # Trace utile en cas d'échec du dépôt : le fichier extrait reste
      # récupérable pour une publication manuelle.
      - name: Conservation du programme extrait
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcm-program
          path: public/vcm/**/vcm-program.normalized.json
          if-no-files-found: warn
