# Nginx vhost pour le gestionnaire (Next.js standalone sur 127.0.0.1:3000)
# Cree le 2026-10-09. Version HTTP uniquement : certbot --nginx ajoutera le SSL
# et la redirection 80->443 (meme methode que router.afrikacash.store).
#
# IMPORTANT : pas de `map $http_upgrade $connection_upgrade` ici. router.
# afrikacash.store.conf le declare deja ; une seconde declaration du meme map
# dans le contexte http ferait echouer `nginx -t` (erreur duplicate).
# On utilise donc `proxy_set_header Connection "";` a la place.

server {
    listen 80;
    listen [::]:80;
    server_name gestionnaire.afrikacash.store;

    client_max_body_size 100M;

    # Assets Next.js : mise en cache longue.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public";
    }

    # Tout le reste (pages + API) : reverse-proxy vers l'application.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /www/wwwlogs/gestionnaire.afrikacash.store.log;
    error_log  /www/wwwlogs/gestionnaire.afrikacash.store.error.log;
}